<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="3 つの思想の三角形">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(210,78%,25%)"/><stop offset="1" stop-color="hsl(210,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(30,78%,25%)"/><stop offset="1" stop-color="hsl(30,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,55%)"/></linearGradient>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect width="900" height="470" fill="#ffffff"/>
<polygon points="450,90 180,385 720,385" fill="none" stroke="#4a5568" stroke-width="2"/>
<rect x="320" y="28" width="260" height="62" rx="8" fill="url(#i1)"/>
<text x="450" y="55" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">合成テクノクラシー</text>
<text x="450" y="78" font-size="12.5" fill="#ffffff" text-anchor="middle">Synthetic technocracy（AI と専門家が統治）</text>
<rect x="40" y="385" width="280" height="62" rx="8" fill="url(#i2)"/>
<text x="180" y="412" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">企業リバタリアニズム</text>
<text x="180" y="435" font-size="12.5" fill="#ffffff" text-anchor="middle">Corporate libertarianism（市場に委ねる）</text>
<rect x="580" y="385" width="280" height="62" rx="8" fill="url(#i3)"/>
<text x="720" y="412" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">デジタル民主主義</text>
<text x="720" y="435" font-size="12.5" fill="#ffffff" text-anchor="middle">Digital democracy（市民の合意形成）</text>
<g font-size="13.5" fill="#1c2330">
<text x="300" y="220" text-anchor="end">普遍主義・経済効率と成長</text>
<text x="300" y="242" text-anchor="end">能力主義</text>
<text x="600" y="220">経済的平等・大規模な協調</text>
<text x="600" y="242" fill="#a51f22" font-weight="700">存亡リスクの軽減</text>
<text x="450" y="412" text-anchor="middle">分散化</text>
<text x="450" y="434" text-anchor="middle">権利と自由</text>
</g>
</svg>
