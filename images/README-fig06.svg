<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="滅亡論と反対論の論点が対立の芯に集まる図">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(210,78%,25%)"/><stop offset="1" stop-color="hsl(210,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(160,78%,25%)"/><stop offset="1" stop-color="hsl(160,58%,55%)"/></linearGradient>
<marker id="i4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#97a1ae"/></marker>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect width="900" height="340" fill="#ffffff"/>
<text x="135" y="24" font-size="16" font-weight="700" fill="hsl(0,78%,35%)" text-anchor="middle">滅亡論</text>
<text x="765" y="24" font-size="16" font-weight="700" fill="hsl(210,78%,30%)" text-anchor="middle">反対論</text>
<g stroke="#97a1ae" stroke-width="1.5" marker-end="url(#i4)">
<line x1="250" y1="58" x2="338" y2="150"/><line x1="250" y1="106" x2="338" y2="160"/><line x1="250" y1="154" x2="338" y2="170"/><line x1="250" y1="202" x2="338" y2="180"/><line x1="250" y1="250" x2="338" y2="190"/><line x1="250" y1="298" x2="338" y2="200"/>
<line x1="650" y1="58" x2="562" y2="150"/><line x1="650" y1="106" x2="562" y2="160"/><line x1="650" y1="154" x2="562" y2="170"/><line x1="650" y1="202" x2="562" y2="180"/><line x1="650" y1="250" x2="562" y2="190"/><line x1="650" y1="298" x2="562" y2="200"/>
</g>
<g fill="url(#i1)">
<rect x="20" y="40" width="230" height="36" rx="6"/><rect x="20" y="88" width="230" height="36" rx="6"/><rect x="20" y="136" width="230" height="36" rx="6"/><rect x="20" y="184" width="230" height="36" rx="6"/><rect x="20" y="232" width="230" height="36" rx="6"/><rect x="20" y="280" width="230" height="36" rx="6"/>
</g>
<g fill="url(#i2)">
<rect x="650" y="40" width="230" height="36" rx="6"/><rect x="650" y="88" width="230" height="36" rx="6"/><rect x="650" y="136" width="230" height="36" rx="6"/><rect x="650" y="184" width="230" height="36" rx="6"/><rect x="650" y="232" width="230" height="36" rx="6"/><rect x="650" y="280" width="230" height="36" rx="6"/>
</g>
<rect x="340" y="120" width="220" height="110" rx="10" fill="url(#i3)"/>
<g font-size="13.5" fill="#ffffff" text-anchor="middle">
<text x="135" y="63">アラインメントできない</text><text x="135" y="111">どんな目標でも人間と衝突</text><text x="135" y="159">知能爆発で一気に超知能</text><text x="135" y="207">やり直しがきかない</text><text x="135" y="255">開発競争で安全が後回し</text><text x="135" y="303">生物兵器などの悪用</text>
<text x="765" y="63">確率に根拠がない</text><text x="765" y="111">目の前の害が先</text><text x="765" y="159">企業の宣伝にすぎない</text><text x="765" y="207">終末予言は外れてきた</text><text x="765" y="255">物理世界は支配できない</text><text x="765" y="303">電源を切ればよい</text>
<text x="450" y="152" font-size="16" font-weight="700">対立の芯</text><text x="450" y="182">変化はどれだけ速いか</text><text x="450" y="208">人間は途中で直せるか</text>
</g>
</svg>
