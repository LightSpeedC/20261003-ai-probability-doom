<g fill="#ffffff" text-anchor="middle">
<text x="160" y="43" font-size="15" font-weight="700">doom の範囲</text><text x="160" y="64" font-size="12">絶滅だけか、支配の喪失も含むか</text>
<text x="160" y="123" font-size="15" font-weight="700">期間</text><text x="160" y="144" font-size="12">今世紀中か、10 年以内か</text>
<text x="160" y="203" font-size="15" font-weight="700">前提</text><text x="160" y="224" font-size="12">AGI ができたら、など</text>
<text x="450" y="124" font-size="15" font-weight="700">本人の主観</text><text x="450" y="145" font-size="12">勘・世界観・立場</text>
<text x="745" y="124" font-size="17" font-weight="700">p(doom) ＝ ○%</text><text x="745" y="145" font-size="12">人ごとに定義が違う数字</text>
