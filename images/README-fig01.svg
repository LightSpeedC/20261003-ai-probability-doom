	<rect width="100%" height="100%" fill="#ffffff"/>
<rect width="900" height="260" fill="#ffffff"/>
<g stroke="#4a5568" stroke-width="2" marker-end="url(#i6)">
<line x1="290" y1="48" x2="358" y2="112"/><line x1="290" y1="128" x2="358" y2="128"/><line x1="290" y1="208" x2="358" y2="144"/><line x1="540" y1="128" x2="618" y2="128"/>
</g>
<rect x="30" y="20" width="260" height="56" rx="8" fill="url(#i1)"/>
<rect x="30" y="100" width="260" height="56" rx="8" fill="url(#i2)"/>
<rect x="30" y="180" width="260" height="56" rx="8" fill="url(#i3)"/>
