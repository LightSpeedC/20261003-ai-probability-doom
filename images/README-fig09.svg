<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="日本の論者・政府の立ち位置">
<defs>
<linearGradient id="i1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="hsl(210,58%,55%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(180,78%,25%)"/><stop offset="1" stop-color="hsl(180,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(130,78%,25%)"/><stop offset="1" stop-color="hsl(130,58%,55%)"/></linearGradient>
<linearGradient id="i4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(55,78%,25%)"/><stop offset="1" stop-color="hsl(55,58%,55%)"/></linearGradient>
<linearGradient id="i5" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(8,78%,25%)"/><stop offset="1" stop-color="hsl(8,58%,55%)"/></linearGradient>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect width="900" height="270" fill="#ffffff"/>
<rect x="60" y="117" width="780" height="16" rx="8" fill="url(#i1)"/>
<text x="20" y="260" font-size="13" font-weight="700" fill="hsl(210,78%,30%)">← 存亡リスクに触れない</text>
<text x="890" y="260" font-size="13" font-weight="700" fill="hsl(0,78%,35%)" text-anchor="end">存亡リスクを正面から論じる →</text>
<g stroke="#4a5568" stroke-width="1.5">
<line x1="200" y1="76" x2="200" y2="125"/><line x1="620" y1="76" x2="620" y2="125"/><line x1="340" y1="125" x2="340" y2="178"/><line x1="790" y1="125" x2="790" y2="178"/>
</g>
<g fill="#ffffff" stroke="#1c2330" stroke-width="1.5">
<circle cx="200" cy="125" r="5"/><circle cx="340" cy="125" r="5"/><circle cx="620" cy="125" r="5"/><circle cx="790" cy="125" r="5"/>
</g>
<rect x="100" y="20" width="200" height="56" rx="6" fill="url(#i2)"/>
<rect x="510" y="20" width="220" height="56" rx="6" fill="url(#i4)"/>
<rect x="230" y="178" width="220" height="56" rx="6" fill="url(#i3)"/>
<rect x="670" y="178" width="220" height="56" rx="6" fill="url(#i5)"/>
<g fill="#ffffff" text-anchor="middle">
<text x="200" y="42" font-size="13.5" font-weight="700">Forbes JAPAN の論考</text><text x="200" y="63" font-size="12">滅亡より目の前の課題を</text>
<text x="620" y="42" font-size="13.5" font-weight="700">孫正義</text><text x="620" y="63" font-size="12">人類が頂点の時代は終わる</text>
<text x="340" y="200" font-size="13.5" font-weight="700">日本政府（岸田・高市）</text><text x="340" y="221" font-size="12">信頼できる AI・リスク最小化</text>
<text x="780" y="200" font-size="13.5" font-weight="700">山川宏</text><text x="780" y="221" font-size="12">存亡リスクは「部屋の中の象」</text>
</g>
</svg>
